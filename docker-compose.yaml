services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mongo_db_network
    volumes:
      - leetcode_mongo_data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - redis_network
    volumes:
      - redis_data:/data
  
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres_db_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
  consul-client:
    image: hashicorp/consul
    command: agent -retry-join=consul-server-1 -client=0.0.0.0
    depends_on:
      - consul-server-1
    ports:
      - 8500:8500
    networks:
      - backend   
  
  consul-server-1:
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=3 -node=consul-1 -bind=0.0.0.0 -client=0.0.0.0
    networks:
      - backend 

  consul-server-2:
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=3 -retry-join=consul-server-1 -node=consul-2
    networks:
      - backend 

  consul-server-3:
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=3 -retry-join=consul-server-1 -node=consul-3 
    networks:
      - backend 

  migrate:
    build:
      context: ./auth_service
      dockerfile: Dockerfile.migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_ACCESS_SECRET=local-access-secret-change-in-prod
      - JWT_REFRESH_SECRET=local-refresh-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - postgres_db_network

  # docker inside docker
  # privileged: true is required for Docker-in-Docker (DinD) because the inner Docker daemon (dockerd) needs
  # low-level kernel capabilities that normal containers do not have.
  dind:
    image: docker:24-dind
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - execution


  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - PORT=3000
      - NODE_ENV=production
      - SERVICE_NAME=api-gateway
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
      - FRONTEND_URL=http://localhost:5173
    networks:
      - backend
    depends_on:
      consul-client:
        condition: service_started


  problem-service:
    build:
      context: ./problem_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3010
      - DB_URI=mongodb://mongo:27017/leetcode_problem_service
      - NODE_ENV=production
      - SERVICE_NAME=problem-service
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
      - INTERNAL_HMAC_SHARED_SECRET=kfsKE(@#*oweiKOQWID23984
    depends_on:
      mongo:
        condition: service_healthy
      consul-client:
        condition: service_started
    networks:
      - backend
      - mongo_db_network


  submission-service:
    build:
      context: ./submission_service
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 2
    ports:
      - 3020-3021:3020
    environment:
      - PORT=3020
      - DB_URI=mongodb://mongo:27017/leetcode_submission_service
      - PROBLEM_SERVICE_URL=http://problem-service:3010/api/v1
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=submission-service
      - NODE_ENV=production
      - EVALUATION_JOB_NAME=evaluate-submission
      - SUBMISSION_QUEUE_NAME=submission_queue
      - STATUS_UPDATE_QUEUE_NAME=status_update_queue
      - STATUS_UPDATE_JOB_NAME=update-submission-status
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
      - INTERNAL_HMAC_SHARED_SECRET=kfsKE(@#*oweiKOQWID23984
      - CONTEST_SUBMISSION_STATUS_UPDATE_JOB_NAME=contest-submission-status-update-status
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-client:
        condition: service_started
    networks:
      - backend
      - mongo_db_network
      - redis_network

  evaluation-service:
    build:
      context: ./evaluation_service
      dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - 3030:3030
    environment:
      - PORT=3030
      - PROBLEM_SERVICE_URL=http://problem-service:3010/api/v1
      - SUBMISSION_SERVICE_URL=http://submission-service:3020/api/v1
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://dind:2375
      - SERVICE_NAME=evaluation-service
      - EVALUATION_JOB_NAME=evaluate-submission
      - SUBMISSION_QUEUE_NAME=submission_queue
      - STATUS_UPDATE_QUEUE_NAME=status_update_queue
      - STATUS_UPDATE_JOB_NAME=update-submission-status
      - CONTEST_SUBMISSION_STATUS_UPDATE_JOB_NAME=contest-submission-status-update-status
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_healthy
    networks:
      - backend
      - execution
      - redis_network


  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    restart: unless-stopped
    # ports:
    #   - 3002:3002
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_ACCESS_SECRET=ldfjsdfkEKFHWK#&!#*81273
      - JWT_REFRESH_SECRET=ldfjsdfkEKFHWK#&!#*81273
      - JWT_ACCESS_EXPIRES_IN=1h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3002
      - NODE_ENV=production
      - SERVICE_NAME=auth-service
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      consul-client:
        condition: service_started
    networks:
      - backend
      - postgres_db_network

networks:
  backend:        # shared / API layer
    driver: bridge
  execution:      # isolated for dind + evaluation only
    driver: bridge
  mongo_db_network:     # only services that need their DB
    driver: bridge
  postgres_db_network:     # only services that need their DB
    driver: bridge
  redis_network:
    driver: bridge

volumes:
  redis_data:
  postgres_data:
  leetcode_mongo_data:
services:
  mongo:
    image: mongo:latest
    restart: unless-stopped
    # ports:
    #   - 27017:27017
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mongo_db_network
    volumes:
      - leetcode_mongo_data:/data/db
    labels:
      - "traefik.enable=false"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # ports:
    #   - 6379:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - redis_network
    volumes:
      - redis_data:/data
    labels:
      - "traefik.enable=false"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    # ports:
    #   - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres_db_network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    labels:
      - "traefik.enable=false"


  consul-client:
    image: hashicorp/consul
    command: agent -retry-join=consul-server-1 -client=0.0.0.0
    depends_on:
      - consul-server-1
    # ports:
    #   - 8500:8500
    networks:
      - backend   
    labels:
      - "traefik.enable=false"
  
  consul-server-1:
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=3 -node=consul-1 -bind=0.0.0.0 -client=0.0.0.0
    networks:
      - backend 
    labels:
      - "traefik.enable=false"

  consul-server-2:
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=3 -retry-join=consul-server-1 -node=consul-2
    networks:
      - backend 
    labels:
      - "traefik.enable=false"

  consul-server-3:
    image: hashicorp/consul
    command: agent -server -bootstrap-expect=3 -retry-join=consul-server-1 -node=consul-3 
    networks:
      - backend 
    labels:
      - "traefik.enable=false"

  
  reverse-proxy:
    image: traefik:v3.7
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"

      # API & Dashboard   (only for dev)
      - "--api.dashboard=true"
      - "--api.insecure=true"
      
    ports:
      - 80:80
      - 8080:8080
    volumes:  
      - /var/run/docker.sock:/var/run/docker.sock:ro    # mounts the docker socket for traefik to discover containers
    networks:
      - reverse-proxy
      - backend
    labels:   # for traefik dashboard (for dev only, access dashboard at http://traefik.docker.localhost)
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.docker.localhost`)"
      - "traefik.http.routers.dashboard.service=api@internal"


      
  migrate:
    build:
      context: ./auth_service
      dockerfile: Dockerfile.migrate
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_ACCESS_SECRET=local-access-secret-change-in-prod
      - JWT_REFRESH_SECRET=local-refresh-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - postgres_db_network
    labels:
      - "traefik.enable=false"

  
  # docker inside docker
  # privileged: true is required for Docker-in-Docker (DinD) because the inner Docker daemon (dockerd) needs
  # low-level kernel capabilities that normal containers do not have.
  dind:
    image: docker:24-dind
    restart: unless-stopped
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - execution
    labels:
      - "traefik.enable=false"

  

  api-gateway:
    build:
      context: ./api_gateway
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # ports:
    #   - 3000:3000
    deploy:
      replicas: 2
    environment:
      - PORT=3000
      - NODE_ENV=development
      - SERVICE_NAME=api-gateway
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./api_gateway/src:/leetcode-server/api-gateway/src
      - ./api_gateway/package.json:/leetcode-server/api-gateway/package.json
      - ./api_gateway/tsconfig.json:/leetcode-server/api-gateway/tsconfig.json
      - /leetcode-server/api-gateway/node_modules
    networks:
      - backend
      - reverse-proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/api-gateway/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      consul-client:
        condition: service_started
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=reverse-proxy"
      - "traefik.http.routers.api-gateway.rule=Host(`compileX.docker.localhost`)"
      - "traefik.http.routers.api-gateway.entrypoints=web"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.path=/api/api-gateway/health"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.interval=10s"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.timeout=3s"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.port=3000"


  problem-service:
    build:
      context: ./problem_service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    deploy:
      replicas: 2
    environment:
      - PORT=3010
      - DB_URI=mongodb://mongo:27017/leetcode_problem_service
      - NODE_ENV=development
      - SERVICE_NAME=problem-service
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
      - INTERNAL_HMAC_SHARED_SECRET=kfsKE(@#*oweiKOQWID23984
    volumes:
      - ./problem_service/src:/leetcode-server/problem-service/src
      - ./problem_service/package.json:/leetcode-server/problem-service/package.json
      - ./problem_service/tsconfig.json:/leetcode-server/problem-service/tsconfig.json
      - /leetcode-server/problem-service/node_modules
    depends_on:
      mongo:
        condition: service_healthy
      consul-client:
        condition: service_started
    networks:
      - backend
      - mongo_db_network
    labels:
      - "traefik.enable=false"

  submission-service:
    build:
      context: ./submission_service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # ports:
    #   - 3020:3020
    deploy:
      replicas: 2
    # ports:
    #   - 3020-3021:3020
    environment:
      - PORT=3020
      - DB_URI=mongodb://mongo:27017/leetcode_submission_service
      - PROBLEM_SERVICE_URL=http://problem-service:3010/api/v1
      - REDIS_URL=redis://redis:6379
      - SERVICE_NAME=submission-service
      - NODE_ENV=development
      - EVALUATION_JOB_NAME=evaluate-submission
      - SUBMISSION_QUEUE_NAME=submission_queue
      - STATUS_UPDATE_QUEUE_NAME=status_update_queue
      - STATUS_UPDATE_JOB_NAME=update-submission-status
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
      - INTERNAL_HMAC_SHARED_SECRET=kfsKE(@#*oweiKOQWID23984
      - CONTEST_SUBMISSION_STATUS_UPDATE_JOB_NAME=contest-submission-status-update-status
    volumes:
      - ./submission_service/src:/leetcode-server/submission-service/src
      - ./submission_service/package.json:/leetcode-server/submission-service/package.json
      - ./submission_service/tsconfig.json:/leetcode-server/submission-service/tsconfig.json
      - /leetcode-server/submission-service/node_modules # for this
      # Purpose: Prevents host node_modules from overwriting container's node_modules
      # Why: Container needs Linux-specific binaries, host may have different OS/architecture
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      consul-client:
        condition: service_started
    networks:
      - backend
      - mongo_db_network
      - redis_network
    labels:
      - "traefik.enable=false"

  evaluation-service:
    build:
      context: ./evaluation_service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # ports:
    #   - 3030:3030
    # deploy:
    #   replicas: 3
    # ports:
    #   - 3030-3032:3030
    environment:
      - PORT=3030
      - PROBLEM_SERVICE_URL=http://problem-service:3010/api/v1
      - SUBMISSION_SERVICE_URL=http://submission-service:3020/api/v1
      - REDIS_URL=redis://redis:6379
      - DOCKER_HOST=tcp://dind:2375
      - SERVICE_NAME=evaluation-service
      - EVALUATION_JOB_NAME=evaluate-submission
      - SUBMISSION_QUEUE_NAME=submission_queue
      - STATUS_UPDATE_QUEUE_NAME=status_update_queue
      - STATUS_UPDATE_JOB_NAME=update-submission-status
      - CONTEST_SUBMISSION_STATUS_UPDATE_JOB_NAME=contest-submission-status-update-status
    volumes:
      - ./evaluation_service/src:/leetcode-server/evaluation-service/src
      - ./evaluation_service/package.json:/leetcode-server/evaluation-service/package.json
      - ./evaluation_service/tsconfig.json:/leetcode-server/evaluation-service/tsconfig.json
      - /leetcode-server/evaluation-service/node_modules
    depends_on:
      redis:
        condition: service_healthy
      dind:
        condition: service_healthy
    networks:
      - backend
      - execution
      - redis_network
    labels:
      - "traefik.enable=false"

  auth-service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile.dev
    command: npm run dev
    restart: unless-stopped
    # ports:
    #   - 3002:3002
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=auth_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - JWT_ACCESS_SECRET=ldfjsdfkEKFHWK#&!#*81273
      - JWT_REFRESH_SECRET=ldfjsdfkEKFHWK#&!#*81273
      - JWT_ACCESS_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3002
      - NODE_ENV=development
      - SERVICE_NAME=auth-service
      - API_GATEWAY_HMAC_SHARED_SECRET=3049sKKJDIWEO2983023909234
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      consul-client:
        condition: service_started
    volumes:
      - ./auth_service/src:/leetcode-server/auth-service/src
      - ./auth_service/package.json:/leetcode-server/auth-service/package.json
      - ./auth_service/tsconfig.json:/leetcode-server/auth-service/tsconfig.json
      - /leetcode-server/auth-service/node_modules
    networks:
      - backend
      - postgres_db_network
    labels:
      - "traefik.enable=false"
  
  background-worker-service:
    build:
      context: ./background_worker_service
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - SERVICE_NAME=background-worker-service
      - PROBLEM_DB_URI=mongodb://mongo:27017/leetcode_problem_service
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./background_worker_service/src:/leetcode-server/background-worker-service/src
      - ./background_worker_service/package.json:/leetcode-server/background-worker-service/package.json
      - ./background_worker_service/tsconfig.json:/leetcode-server/background-worker-service/tsconfig.json
      - /leetcode-server/background-worker-service/node_modules
    networks:
      - mongo_db_network
      - redis_network
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=false"


networks:
  reverse-proxy:
    driver: bridge
  backend:        # shared / API layer
    driver: bridge
  execution:      # isolated for dind + evaluation only
    driver: bridge
  mongo_db_network:     # only services that need their DB
    driver: bridge
  postgres_db_network:     # only services that need their DB
    driver: bridge
  redis_network:
    driver: bridge


volumes:
  redis_data:
  postgres_data:
  leetcode_mongo_data:
